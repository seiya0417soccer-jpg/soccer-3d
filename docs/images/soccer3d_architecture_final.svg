<text x="1546" y="825" class="bt" text-anchor="start">FakeScoreApiClient</text>
<text x="1546" y="847" class="body" text-anchor="start">差し替え用の代替実装</text>
<path d="M285 737 H325 V770 H360" fill="none" stroke="#3478b8" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<path d="M285 837 H325 V810 H360" fill="none" stroke="#3478b8" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<path d="M595 790 H660" fill="none" stroke="#3478b8" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<path d="M960 810 H895" fill="none" stroke="#3478b8" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<text x="927" y="798" class="sm" text-anchor="middle">実装</text>
<path d="M1195 790 H1260" fill="none" stroke="#3478b8" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<path d="M1530 737 H1500 V770 H1470" fill="none" stroke="#3478b8" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<path d="M1530 837 H1500 V810 H1470" fill="none" stroke="#3478b8" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<text x="1485" y="728" class="sm" text-anchor="middle">実装</text>
<text x="1485" y="860" class="sm" text-anchor="middle">代替</text>
<text x="65" y="905" class="sm" text-anchor="start">両UIはRankingViewModelを利用。ViewModel → IScoreRepository、ApiScoreRepositoryが実装し、IScoreApiClientを通じて通信。</text>
<text x="65" y="925" class="sm" text-anchor="start">RankingInstallerではDockerScoreApiClientを登録。FakeScoreApiClientは差し替え候補。自己ベストはResultManager / PlayerPrefsで別管理。</text>
<text x="58" y="1015" class="sec" text-anchor="start">3. Jev AI 自動プレイヤー（Editor／Development Build向け）</text>
<text x="65" y="1037" class="sm" text-anchor="start">JevPuzzleAutoPlayerが各コンポーネントを調整：Snapshot取得 → 配置候補生成 → Jevの選択 → 既存ロジックで配置</text>
<rect x="65" y="1050" width="260" height="125" rx="13" fill="#eef4fb" stroke="#8aaed0" stroke-width="1.6"/>
<text x="81" y="1077" class="bt" text-anchor="start">JevPuzzleAutoPlayer</text>
<text x="81" y="1102" class="body" text-anchor="start">Jキーで開始／停止</text>
<text x="81" y="1123" class="body" text-anchor="start">ゲーム終了通知を購読</text>
<text x="81" y="1144" class="body" text-anchor="start">全体フローを調整</text>
<rect x="385" y="1050" width="260" height="125" rx="13" fill="#f3f8f4" stroke="#8bb8a2" stroke-width="1.6"/>
<text x="401" y="1077" class="bt" text-anchor="start">IPuzzleAutomationPort</text>
<text x="401" y="1102" class="body" text-anchor="start">DropPuzzleBattleが実装</text>
<text x="401" y="1123" class="body" text-anchor="start">盤面取得・入力停止</text>
<text x="401" y="1144" class="body" text-anchor="start">配置実行・通常操作へ復帰</text>
<rect x="705" y="1050" width="260" height="125" rx="13" fill="#eef4fb" stroke="#8aaed0" stroke-width="1.6"/>
<text x="721" y="1077" class="bt" text-anchor="start">PlacementCandidateGenerator</text>
<text x="721" y="1102" class="body" text-anchor="start">独自GumiData形状</text>
<text x="721" y="1123" class="body" text-anchor="start">合法な配置候補を生成</text>
<text x="721" y="1144" class="body" text-anchor="start">候補盤面を簡易評価</text>
<rect x="1025" y="1050" width="260" height="125" rx="13" fill="#fff7e8" stroke="#d5b56f" stroke-width="1.6"/>
<text x="1041" y="1077" class="bt" text-anchor="start">JevClient</text>
<text x="1041" y="1102" class="body" text-anchor="start">候補IDを含めAPIへ送信</text>
<text x="1041" y="1123" class="body" text-anchor="start">Jevの選択を受信</text>
<text x="1041" y="1144" class="body" text-anchor="start">Typesafe API / UniTask</text>
<rect x="1345" y="1050" width="380" height="125" rx="13" fill="#eef4fb" stroke="#8aaed0" stroke-width="1.6"/>
<text x="1361" y="1077" class="bt" text-anchor="start">DropPuzzleBattle（既存ルール）</text>
<text x="1361" y="1102" class="body" text-anchor="start">候補IDを照合・選択候補を検証</text>
<text x="1361" y="1123" class="body" text-anchor="start">既存のMove／盤面処理で配置を実行</text>
<text x="1361" y="1144" class="body" text-anchor="start">Jevがゲームルールを直接実行しない</text>
<path d="M325 1105 H385" fill="none" stroke="#2e8b70" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
