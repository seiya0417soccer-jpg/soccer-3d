<text x="1015" y="1215" class="sm" text-anchor="middle">ExecutePlacementAsync：選択候補を既存のパズル処理へ渡す</text>
<path d="M585 295 V300 H20 V1110 H65" fill="none" stroke="#536579" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="34" y="820" class="sm" text-anchor="start">GameEnded</text>
<line x1="65" y1="1305" x2="125" y2="1305" stroke="#536579" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="137" y="1310" class="legend" text-anchor="start">依存／呼び出し</text>
<line x1="300" y1="1305" x2="360" y2="1305" stroke="#2e8b70" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
<text x="372" y="1310" class="legend" text-anchor="start">R3・ゲーム連携／自動配置の流れ</text>
<line x1="690" y1="1305" x2="750" y2="1305" stroke="#b77b2c" stroke-width="2.2" marker-end="url(#arrowOrange)"/>
<text x="762" y="1310" class="legend" text-anchor="start">外部APIへの判断依頼／選択結果</text>
<line x1="1100" y1="1305" x2="1160" y2="1305" stroke="#7b8794" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="1172" y="1310" class="legend" text-anchor="start">DI／ライフサイクル通知</text>
<text x="65" y="1355" class="sm" text-anchor="start">注：図は共有されたコードを優先し、旧図は未確認部分の補助に使用。全クラス間の依存を網羅したクラス図ではない。</text>
<text x="65" y="1378" class="sm" text-anchor="start">Jevは特殊ブロックの戦略を対象外とし、候補選択を担当。実際の配置・ゲームルールはUnity側が実行する。</text>
</svg>