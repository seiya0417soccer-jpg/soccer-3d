<text x="48" y="52" class="title" text-anchor="start">ゲームアーキテクチャ図（コード確認優先・旧図で補完）</text>
<text x="48" y="82" class="sub" text-anchor="start">コードで確認できた関係を優先し、旧図の情報は未確認部分の補助に使用。矢印は依存・イベント／処理フローを区別。</text>
