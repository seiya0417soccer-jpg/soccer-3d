<text x="676" y="772" class="bt" text-anchor="start">IScoreRepository</text>
<text x="676" y="794" class="body" text-anchor="start">リポジトリの抽象</text>
<text x="676" y="814" class="body" text-anchor="start">ViewModelから利用</text>
<rect x="960" y="745" width="235" height="90" rx="13" fill="#eef4fb" stroke="#8aaed0" stroke-width="1.6"/>
<text x="976" y="772" class="bt" text-anchor="start">ApiScoreRepository</text>
<text x="976" y="794" class="body" text-anchor="start">IScoreRepository実装</text>
<text x="976" y="814" class="body" text-anchor="start">IScoreApiClientを利用</text>
<rect x="1260" y="745" width="210" height="90" rx="13" fill="#fff7e8" stroke="#d5b56f" stroke-width="1.6"/>
<text x="1276" y="772" class="bt" text-anchor="start">IScoreApiClient</text>
<text x="1276" y="794" class="body" text-anchor="start">API通信の抽象</text>
<text x="1276" y="814" class="body" text-anchor="start">依存先として利用</text>
<rect x="1530" y="700" width="200" height="75" rx="13" fill="#fff7e8" stroke="#d5b56f" stroke-width="1.6"/>
<text x="1546" y="725" class="bt" text-anchor="start">DockerScoreApiClient</text>
<text x="1546" y="747" class="body" text-anchor="start">有効なAPI実装</text>
