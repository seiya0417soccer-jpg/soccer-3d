<text x="81" y="517" class="body" text-anchor="start">DropPuzzleBattle → BattleMainManager</text>
<text x="81" y="538" class="body" text-anchor="start">OnBlocksDestroyed / OnEKeyBombExploded</text>
<text x="81" y="559" class="body" text-anchor="start">YushaBrain → BattleMainManager: OnDebuffFinished</text>
<rect x="610" y="465" width="500" height="112" rx="13" fill="#f5f1fb" stroke="#b6a2d3" stroke-width="1.6"/>
<text x="626" y="492" class="bt" text-anchor="start">ゲーム終了通知（C# event）</text>
<text x="626" y="517" class="body" text-anchor="start">GameFlowManager.GameEnded</text>
<text x="626" y="538" class="body" text-anchor="start">GameOverState / FinishState への遷移時に発行</text>
<text x="626" y="559" class="body" text-anchor="start">JevPuzzleAutoPlayer が購読して自動プレイを停止</text>
<rect x="1155" y="465" width="570" height="112" rx="13" fill="#f5f1fb" stroke="#b6a2d3" stroke-width="1.6"/>
<text x="1171" y="492" class="bt" text-anchor="start">GameFlowManager の主な注入依存（Construct）</text>
<text x="1171" y="517" class="body" text-anchor="start">IPuzzleField / IBattleField / ICameraShakeable</text>
<text x="1171" y="538" class="body" text-anchor="start">GameTimer / EnemySpawner / IScoreWriter / ResultManager</text>
<text x="1171" y="559" class="body" text-anchor="start">RankingSubmitUI / RankingView</text>
<text x="58" y="675" class="sec" text-anchor="start">2. オンラインランキング（結果画面から利用）</text>
<rect x="65" y="700" width="220" height="75" rx="13" fill="#eef4fb" stroke="#8aaed0" stroke-width="1.6"/>
<text x="81" y="725" class="bt" text-anchor="start">RankingSubmitUI</text>
<text x="81" y="747" class="body" text-anchor="start">名前入力・登録・再試行</text>
<rect x="65" y="800" width="220" height="75" rx="13" fill="#eef4fb" stroke="#8aaed0" stroke-width="1.6"/>
<text x="81" y="825" class="bt" text-anchor="start">RankingView</text>
<text x="81" y="847" class="body" text-anchor="start">ランキング取得・表示</text>
<rect x="360" y="745" width="235" height="90" rx="13" fill="#f3f8f4" stroke="#8bb8a2" stroke-width="1.6"/>
<text x="376" y="772" class="bt" text-anchor="start">RankingViewModel</text>
<text x="376" y="794" class="body" text-anchor="start">Load / Submit・状態管理</text>
<text x="376" y="814" class="body" text-anchor="start">Loading / Success / Error</text>
