<text x="81" y="227" class="body" text-anchor="start">Core / Puzzle / Battle / Ranking</text>
<text x="81" y="248" class="body" text-anchor="start">各Installerを登録</text>
<rect x="420" y="175" width="330" height="120" rx="13" fill="#eef4fb" stroke="#8aaed0" stroke-width="1.6"/>
<text x="436" y="202" class="bt" text-anchor="start">GameFlowManager</text>
<text x="436" y="227" class="body" text-anchor="start">IGameStateで状態遷移</text>
<text x="436" y="248" class="body" text-anchor="start">IGameLifecycleEventsを実装</text>
<text x="436" y="269" class="body" text-anchor="start">依存: Puzzle / Battle / Timer / Ranking 等</text>
<rect x="825" y="175" width="285" height="105" rx="13" fill="#eef4fb" stroke="#8aaed0" stroke-width="1.6"/>
